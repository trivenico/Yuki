[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki"
version = "0.2.0"
description = "A modular personal AI agent for desktop/terminal."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0,<7.0"]
ui = ["textual>=0.80,<2.0"]
discord = ["PyNaCl>=1.5,<2.0"]
llama-cpp = ["llama-cpp-python>=0.3,<1.0"]
mlx = ["mlx-lm>=0.21,<1.0; platform_system == 'Darwin' and platform_machine == 'arm64'"]


[project.scripts]
yuki = "main:main"
yuki-onboard = "ui.onboarding_tui:main"
yuki-daemon = "automation.daemon_cli:main"

[tool.setuptools]
py-modules = [
    "main",
    "yuki",
    "yuki_version",
    "yuki_agent",
    "yuki_approvals",
    "yuki_events",
    "yuki_identity",
    "yuki_learning",
    "yuki_orchestrator",
    "yuki_planner",
    "yuki_providers",
    "yuki_security",
    "yuki_tasks",
    "yuki_tools",
    "yuki_workflow",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "companion*", "skills*", "providers*", "defense*", "hackback*", "voice*", "ui*", "knowledge*", "automation*", "scripts*"]
