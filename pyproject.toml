[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki-personal-agent"
version = "0.1.0"
description = "Local-first personal agent with guarded skills, explicit human approval, and local knowledge tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.2,<7.0",
]

[project.optional-dependencies]
voice = [
  "pyttsx3>=2.90,<3.0",
  "faster-whisper>=1.1,<2.0",
  "sounddevice>=0.4.6,<1.0",
  "numpy>=1.26,<3.0",
  "openwakeword>=0.6,<1.0",
  "soundfile>=0.12,<1.0",
]
ui = [
  "textual>=0.80,<2.0",
]
email = [
  "google-api-python-client>=2.140,<3.0",
  "google-auth>=2.35,<3.0",
  "google-auth-oauthlib>=1.2,<2.0",
]
security = [
  "scapy>=2.5,<3.0",
]
backup = [
  "cryptography>=50.0.0,<51.0.0",
]
dev = [
  "ruff==0.11.2",
  "mypy==1.15.0",
  "pre-commit==4.2.0",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
yuki = "main:main"\nyuki-mobile = "mobile.server:main"

[tool.setuptools]
py-modules = ["main", "yuki_agent"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "companion*",
  "core*",
  "skills*",
  "knowledge*",
  "voice*",
  "defense*",
  "hackback*",
  "providers*",
  "ui*",\n  "mobile*",
]
exclude = ["tests*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["core", "skills", "knowledge"]
mypy_path = "."
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
