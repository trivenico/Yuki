[build-system]
requires = ["setuptools>=69,<82", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "yuki-ai-assistant"
version = "0.1.0"
description = "A personal AI assistant with guarded tools, local memory, and pluggable model providers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "PyYAML>=6.0.3,<7.0",
]

[project.optional-dependencies]
production-storage = [
  "psycopg[binary]>=3.2.3,<4",
  "psycopg-pool>=3.2.4,<4",
  "cryptography>=42,<47",
  "keyring>=25,<27",
]
portable-bootstrap = [
  "cryptography>=42,<47",
]
voice = [
  "pyttsx3>=2.90,<3.0",
  "faster-whisper>=1.2.1,<2.0",
  "sounddevice>=0.5.6,<1.0",
  "numpy>=1.26,<3.0",
  "openwakeword>=0.6,<1.0",
  "soundfile>=0.14.0,<1.0",
]
ui = ["textual>=0.80,<2.0"]
email = [
  "google-api-python-client>=2.201.0,<3.0",
  "google-auth>=2.35,<3.0",
  "google-auth-oauthlib>=1.5.0,<2.0",
]
browser = [
  "playwright>=1.50,<2.0",
]
defense = [
  "scapy>=2.6,<3.0",
]
vision = [
  "opencv-python-headless>=4.10,<5.0",
  "openai>=1.60,<3.0",
]

[project.scripts]
yuki = "yuki_cli:main"
yuki-assistant = "main:main"
yuki-portable-bootstrap = "yuki_trust.portable_bootstrap:main"

[tool.setuptools]
# These root-level modules are still part of the supported runtime while the
# repository is migrated incrementally into packages. Keep them in the wheel
# so clean installs and portable runtime builds do not silently omit them.
py-modules = [
  "main", "yuki", "yuki_agent", "yuki_agent_runtime", "yuki_agent_worker",
  "yuki_approvals", "yuki_cli", "yuki_evaluate_model", "yuki_events",
  "yuki_hf_model_diff", "yuki_hf_model_scout", "yuki_identity",
  "yuki_learning", "yuki_model_discovery", "yuki_model_registry",
  "yuki_orchestrator", "yuki_planner", "yuki_provider_worker",
  "yuki_providers", "yuki_security", "yuki_tasks", "yuki_tools",
  "yuki_workflow",
]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# api/ and integrations/ are namespace packages (no __init__.py yet), but
# they contain deployable service and provider-integration modules. Explicitly
# include them so wheel builds do not silently omit those runtime surfaces.
include = [
  "api*", "automation*", "companion*", "core*", "defense*", "evaluation*",
  "hackback*", "integrations*", "knowledge*", "providers*", "skills*", "ui*",
  "voice*", "yuki_trust*",
]
exclude = ["tests*", "benchmarks*", "scripts*", "tools*"]

[tool.setuptools.package-data]
core = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
