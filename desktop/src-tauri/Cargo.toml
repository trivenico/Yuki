[package]
name = "yuki-desktop"
version = "0.1.0"
description = "Yuki native desktop shell"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-notification = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(windows)".dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(target_os = \"macos\")".dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target."cfg(target_os = \"linux\")".dependencies]
# Entry's API is synchronous. Use keyutils plus the synchronous Secret
# Service backend; async-secret-service is not appropriate for this API.
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
