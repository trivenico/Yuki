services:
  yuki-gateway:
    build:
      context: ../..
      dockerfile: deploy/oci-free/Dockerfile
      args:
        INSTALL_OCI_AUTH: ${YUKI_INSTALL_OCI_AUTH:-false}
    image: yuki-gateway:local
    restart: unless-stopped
    init: true
    environment:
      YUKI_GATEWAY_HOST: 0.0.0.0
      YUKI_GATEWAY_PORT: "8765"
      YUKI_GATEWAY_DATABASE: /var/lib/yuki/gateway.sqlite3
      YUKI_GATEWAY_ADMIN_TOKEN: ${YUKI_GATEWAY_ADMIN_TOKEN:?Set YUKI_GATEWAY_ADMIN_TOKEN}
      YUKI_GATEWAY_BOOTSTRAP_ENABLED: ${YUKI_GATEWAY_BOOTSTRAP_ENABLED:-false}
      YUKI_GATEWAY_OWNER_ID: ${YUKI_GATEWAY_OWNER_ID:-}
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - yuki-gateway-data:/var/lib/yuki
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  yuki-worker:
    build:
      context: ../..
      dockerfile: deploy/oci-free/Dockerfile
      args:
        INSTALL_OCI_AUTH: ${YUKI_INSTALL_OCI_AUTH:-false}
    image: yuki-gateway:local
    command: ["python", "-m", "automation.worker_service"]
    restart: unless-stopped
    init: true
    depends_on:
      yuki-gateway:
        condition: service_healthy
    environment:
      YUKI_GATEWAY_DATABASE: /var/lib/yuki/gateway.sqlite3
      YUKI_PROVIDER: ${YUKI_PROVIDER:?Set YUKI_PROVIDER explicitly}
      YUKI_WORKER_ID: ${YUKI_WORKER_ID:-yuki-specialist-worker}
      YUKI_WORKER_SERVICE_ACTOR_ID: yuki-worker-service
      YUKI_WORKER_CLOUD_CONSENT_AGENT_IDS: ${YUKI_WORKER_CLOUD_CONSENT_AGENT_IDS:-}
      YUKI_WORKER_IDLE_POLL_SECONDS: ${YUKI_WORKER_IDLE_POLL_SECONDS:-1}
      YUKI_WORKER_ERROR_BACKOFF_SECONDS: ${YUKI_WORKER_ERROR_BACKOFF_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      YUKI_OCI_REGION: ${YUKI_OCI_REGION:-}
      YUKI_OCI_MODEL: ${YUKI_OCI_MODEL:-}
      YUKI_OCI_PROJECT_OCID: ${YUKI_OCI_PROJECT_OCID:-}
      OCI_GENAI_API_KEY: ${OCI_GENAI_API_KEY:-}
      YUKI_OCI_AUTH_MODE: ${YUKI_OCI_AUTH_MODE:-}
      YUKI_OCI_API_MODE: ${YUKI_OCI_API_MODE:-chat_completions}
      YUKI_PROVIDER_ROUTES_JSON: ${YUKI_PROVIDER_ROUTES_JSON:-}
      YUKI_PROVIDER_DEFAULT_ROUTE: ${YUKI_PROVIDER_DEFAULT_ROUTE:-oci_managed}
      YUKI_SELF_HOSTED_MODEL: ${YUKI_SELF_HOSTED_MODEL:-}
      YUKI_SELF_HOSTED_BASE_URL: ${YUKI_SELF_HOSTED_BASE_URL:-}
      YUKI_CLOUD_ALLOWED_HOSTS: ${YUKI_CLOUD_ALLOWED_HOSTS:-}
      YUKI_SELF_HOSTED_API_KEY: ${YUKI_SELF_HOSTED_API_KEY:-}
      YUKI_OLLAMA_BASE_URL: ${YUKI_OLLAMA_BASE_URL:-}
      YUKI_OLLAMA_MODEL: ${YUKI_OLLAMA_MODEL:-}
    volumes:
      - yuki-gateway-data:/var/lib/yuki
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 128

volumes:
  yuki-gateway-data:
