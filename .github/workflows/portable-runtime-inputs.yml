name: Portable runtime input validation

on:
  pull_request:
    paths:
      - "scripts/portable_runtime_inputs.py"
      - "tests/test_portable_runtime_inputs.py"
      - "docs/portable-runtime-input-validation.md"
      - ".github/workflows/portable-runtime-inputs.yml"
  push:
    branches: [main]
    paths:
      - "scripts/portable_runtime_inputs.py"
      - "tests/test_portable_runtime_inputs.py"
      - ".github/workflows/portable-runtime-inputs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-portable-runtime-inputs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-tests:
    name: Runtime input validation / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library validation tests
        run: python -m unittest discover -s tests -p "test_portable_runtime_inputs.py" -v
      - name: Verify command-line interface
        run: python scripts/portable_runtime_inputs.py --help
