name: Yuki worker service tests

on:
  pull_request:
    paths:
      - "yuki_agent_runtime.py"
      - "yuki_agent_worker.py"
      - "yuki_provider_worker.py"
      - "yuki_providers.py"
      - "yuki_worker_service.py"
      - "providers/**"
      - "tests/test_yuki_worker_service.py"
      - "tests/test_yuki_provider_worker.py"
      - "tests/test_yuki_agent_worker.py"
      - "tests/test_yuki_agent_runtime.py"
      - "docs/PHASE72_WORKER_SERVICE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run worker service tests
        run: python -m unittest discover -s tests -p 'test_yuki_worker_service.py'
