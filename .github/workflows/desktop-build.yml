name: Yuki desktop build

on:
  pull_request:
    paths:
      - "ui/desktop/**"
      - "companion/**"
      - "core/**"
      - "providers/**"
      - "automation/**"
      - "requirements*.txt"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [main]
    paths:
      - "ui/desktop/**"
      - "companion/**"
      - "core/**"
      - "providers/**"
      - "automation/**"
      - "requirements*.txt"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install desktop and build dependencies
        run: python -m pip install --requirement requirements.txt --requirement requirements-desktop.txt --requirement requirements-desktop-build.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Verify import-safe desktop package
        run: python -c "import ui.desktop; import ui.desktop.launch; print('desktop imports without starting Qt')"
      - name: Build native desktop bundle
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name Yuki --collect-all keyring --collect-submodules keyring.backends ui/desktop/launch.py
      - name: Upload unsigned developer bundle
        uses: actions/upload-artifact@v7
        with:
          name: yuki-desktop-${{ matrix.os }}
          path: dist/Yuki/
          if-no-files-found: error
          retention-days: 7
