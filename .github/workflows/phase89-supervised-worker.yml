name: Phase 89 supervised worker recovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yuki-supervised-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Supervised worker / Python 3.11 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile supervision and task runtime
        run: python -m compileall -q automation/worker_supervisor.py automation/task_runtime.py automation/workflow_store.py automation/specialist_worker.py tests/test_worker_supervisor.py tests/test_task_runtime.py
      - name: Test supervised worker
        run: python -m unittest discover -s tests -p 'test_worker_supervisor.py' -v
      - name: Test task runtime
        run: python -m unittest discover -s tests -p 'test_task_runtime.py' -v
      - name: Test specialist worker
        run: python -m unittest discover -s tests -p 'test_specialist_worker.py' -v
      - name: Test workflow store
        run: python -m unittest discover -s tests -p 'test_workflow_store.py' -v
      - name: Test workflow safety
        run: python -m unittest discover -s tests -p 'test_workflow_engine.py' -v
