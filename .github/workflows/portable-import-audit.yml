name: Portable import audit

on:
  pull_request:
    paths:
      - "scripts/portable_import_audit.py"
      - "tests/test_portable_import_audit.py"
      - ".github/workflows/portable-import-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/portable_import_audit.py"
      - "tests/test_portable_import_audit.py"
      - ".github/workflows/portable-import-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Import inventory / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install "pytest>=8,<9"
      - name: Test import audit
        run: python -m pytest -q tests/test_portable_import_audit.py
      - name: Generate runtime import inventory
        run: python scripts/portable_import_audit.py --root . --json
