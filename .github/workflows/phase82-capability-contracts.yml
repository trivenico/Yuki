name: Phase 82 capability contract gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-capability-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-contracts:
    name: Capability manifest / Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile capability contract modules
        run: python -m compileall -q core/capability_manifest.py core/capabilities.py tests/test_capability_manifest.py
      - name: Validate capability manifest and evidence
        run: python -m unittest discover -s tests -p 'test_capability_manifest.py' -v
