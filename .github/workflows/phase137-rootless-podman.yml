name: Phase 137 rootless Podman isolation

on:
  workflow_dispatch:
    inputs:
      worker_image:
        description: "Trusted Python 3.11+ worker image pinned by @sha256:<64 hex chars>"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: phase137-podman-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This is intentionally a manual release gate that can run against the PR
  # branch before merge. Keep permissions read-only and require an immutable,
  # allow-listed worker image digest below.
  rootless-podman-integration:
    name: Rootless Podman isolation contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate immutable worker image input
        env:
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: |
          python - <<'PY'
          import os
          import re
          image = os.environ["WORKER_IMAGE"].strip()
          if not re.fullmatch(r"docker\.io/library/python:3\.11-slim@sha256:[0-9a-f]{64}", image):
              raise SystemExit(
                  "worker_image must be the official docker.io/library/python:3.11-slim image pinned by a lowercase sha256 digest"
              )
          PY

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Verify rootless runtime
        run: |
          podman info --format json > podman-info.json
          python - <<'PY'
          import json
          with open("podman-info.json", encoding="utf-8") as stream:
              info = json.load(stream)
          rootless = info.get("host", {}).get("security", {}).get("rootless")
          if rootless is not True:
              raise SystemExit("Podman is not running rootless; refusing integration test")
          PY

      - name: Pull only the approved digest-pinned worker image
        env:
          WORKER_IMAGE: ${{ inputs.worker_image }}
        run: podman pull "$WORKER_IMAGE"

      - name: Run opt-in integration contract
        env:
          YUKI_PODMAN_INTEGRATION: "1"
          YUKI_TEST_WORKER_IMAGE: ${{ inputs.worker_image }}
        run: python -m unittest tests.integration.test_isolated_upgrade_worker_podman -v
