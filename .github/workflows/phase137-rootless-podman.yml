name: Phase 137 rootless Podman isolation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase137-podman-protected-main
  cancel-in-progress: false

jobs:
  rootless-podman-integration:
    # Authoritative acceptance may run only from protected main on a dedicated,
    # isolated runner. Pull requests use unit tests and cannot select runner images.
    if: github.ref == 'refs/heads/main'
    name: Rootless Podman isolation contract
    runs-on: [self-hosted, linux, yuki-rootless-podman]
    environment: yuki-rootless-podman-acceptance
    timeout-minutes: 15
    steps:
      - name: Check out protected main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate trusted immutable worker image
        env:
          WORKER_IMAGE: ${{ vars.YUKI_TEST_WORKER_IMAGE }}
        run: |
          python - <<'PY'
          import os
          import re
          image = os.environ.get("WORKER_IMAGE", "").strip()
          if not re.fullmatch(r"docker\.io/library/python:3\.11-slim@sha256:[0-9a-f]{64}", image):
              raise SystemExit(
                  "YUKI_TEST_WORKER_IMAGE must be the official Python 3.11 slim image pinned by a lowercase sha256 digest"
              )
          PY

      - name: Verify rootless runtime
        run: |
          podman info --format json > podman-info.json
          python - <<'PY'
          import json
          with open("podman-info.json", encoding="utf-8") as stream:
              info = json.load(stream)
          if info.get("host", {}).get("security", {}).get("rootless") is not True:
              raise SystemExit("Podman is not running rootless; refusing integration test")
          PY

      - name: Pull only the approved digest-pinned worker image
        env:
          WORKER_IMAGE: ${{ vars.YUKI_TEST_WORKER_IMAGE }}
        run: podman pull "$WORKER_IMAGE"

      - name: Run isolated worker integration contract
        env:
          YUKI_PODMAN_INTEGRATION: "1"
          YUKI_TEST_WORKER_IMAGE: ${{ vars.YUKI_TEST_WORKER_IMAGE }}
        run: python -m unittest tests.integration.test_isolated_upgrade_worker_podman -v
