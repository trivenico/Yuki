name: Yuki Desktop Shell

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/yuki-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/yuki-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate deterministic Windows application icon
        run: node scripts/create-icon.mjs
      - name: Test desktop runtime health response parser
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows desktop bundles
        run: npm run build
      - name: Upload unsigned Windows installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yuki-windows-installers-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
