name: Yuki Desktop Shell

on:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/yuki-desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/yuki-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate deterministic Windows application icon
        run: node scripts/create-icon.mjs
      - name: Test desktop runtime health response parser
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Windows desktop bundles
        run: npm run build
      - name: Generate installer SHA-256 manifest
        if: success()
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $files = Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in @(".msi", ".exe") }
          if ($files.Count -eq 0) { throw "No Windows installer files were produced." }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $relative = [System.IO.Path]::GetRelativePath((Resolve-Path $bundle).Path, $_.FullName)
            "$hash  $relative"
          }
          $lines | Set-Content -Path (Join-Path $bundle "SHA256SUMS.txt") -Encoding ascii
      - name: Upload unsigned Windows installer artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yuki-windows-installers-unsigned
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
