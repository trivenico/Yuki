name: Installed CLI packaging

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "yuki_cli.py"
      - "core/config.py"
      - "core/portable_paths.py"
      - "core/default_config.yaml"
      - "tests/test_cli_packaging.py"
      - ".github/workflows/installed-cli-packaging.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "yuki_cli.py"
      - "core/config.py"
      - "core/portable_paths.py"
      - "core/default_config.yaml"
      - ".github/workflows/installed-cli-packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-smoke:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify installed command outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from core.config import load_config; assert load_config()['name'] == 'Yuki'"
          yuki doctor
