name: Phase 94 built-in auth integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yuki-auth-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Auth integration / Python 3.11 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile authentication integration
        run: python -m compileall -q core/auth.py core/auth_http.py automation/workflow_approval.py automation/workflow_store.py tests/test_auth.py tests/test_auth_http.py
      - name: Test authentication core
        run: python -m unittest discover -s tests -p 'test_auth.py' -v
      - name: Test ASGI auth and CSRF middleware
        run: python -m unittest discover -s tests -p 'test_auth_http.py' -v
      - name: Test workflow approval
        run: python -m unittest discover -s tests -p 'test_workflow_approval.py' -v
      - name: Test authorized read tools
        run: python -m unittest discover -s tests -p 'test_authorized_read_tools.py' -v
      - name: Test engineering workflow
        run: python -m unittest discover -s tests -p 'test_engineering_workflow.py' -v
