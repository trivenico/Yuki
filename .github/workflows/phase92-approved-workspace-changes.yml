name: Phase 92 approved workspace changes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yuki-approved-workspace-changes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Approved workspace changes / Python 3.11 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile approved workspace services
        run: python -m compileall -q automation/approved_workspace_changes.py automation/authorized_read_tools.py tests/test_approved_workspace_changes.py
      - name: Test approved workspace changes
        run: python -m unittest discover -s tests -p 'test_approved_workspace_changes.py' -v
      - name: Test authorized read tools
        run: python -m unittest discover -s tests -p 'test_authorized_read_tools.py' -v
      - name: Test specialist read-tool adapter
        run: python -m unittest discover -s tests -p 'test_specialist_read_tool_adapter.py' -v
      - name: Test task runtime
        run: python -m unittest discover -s tests -p 'test_task_runtime.py' -v
      - name: Test workflow safety
        run: python -m unittest discover -s tests -p 'test_workflow_engine.py' -v
