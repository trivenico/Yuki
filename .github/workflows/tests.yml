name: Yuki quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v


  native-runner-protocol:
    name: Native runner protocol / ${{ matrix.arch }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compile native protocol with strict diagnostics
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I evaluation evaluation/native_runner_protocol.c \
            tests/native_runner_protocol_test.c -o native-runner-protocol-test
      - name: Run native protocol conformance smoke test
        run: ./native-runner-protocol-test
      - name: Compile Linux transport boundary test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I evaluation evaluation/native_runner_protocol.c \
            evaluation/linux_runner_transport.c \
            tests/linux_runner_transport_test.c -o linux-runner-transport-test
      - name: Run Linux transport boundary test
        run: ./linux-runner-transport-test
      - name: Audit a statically linked native helper build
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -static \
            -I evaluation evaluation/native_runner_protocol.c \
            evaluation/linux_runner_transport.c \
            evaluation/linux_runner_helper.c -o linux-runner-helper-static
          readelf -l linux-runner-helper-static > native-runner-program-headers.txt
          if grep -q 'INTERP' native-runner-program-headers.txt; then
            echo "Static helper unexpectedly declares a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d linux-runner-helper-static 2>/dev/null | grep -q 'NEEDED'; then
            echo "Static helper unexpectedly declares dynamic dependencies" >&2
            exit 1
          fi
          file linux-runner-helper-static
          sha256sum linux-runner-helper-static
      - name: Compile inert native helper and process handshake test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I evaluation evaluation/native_runner_protocol.c \
            evaluation/linux_runner_transport.c \
            evaluation/linux_runner_helper.c -o linux-runner-helper
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I evaluation evaluation/native_runner_protocol.c \
            evaluation/linux_runner_transport.c \
            tests/linux_runner_helper_test.c -o linux-runner-helper-test
      - name: Run native helper process handshake test
        run: ./linux-runner-helper-test ./linux-runner-helper
      - name: Compile pidfd-backed native spawn adapter test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I evaluation evaluation/native_runner_protocol.c \
            evaluation/linux_runner_transport.c \
            evaluation/linux_runner_spawn.c \
            tests/linux_runner_spawn_test.c -o linux-runner-spawn-test
      - name: Run pidfd-backed native spawn adapter test
        run: ./linux-runner-spawn-test "$PWD/linux-runner-helper"
      - name: Compile opaque lifecycle-only native runner ABI
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC \
            -I evaluation -c evaluation/linux_runner_abi.c -o linux-runner-abi.o
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC \
            -I evaluation -c evaluation/linux_runner_spawn.c -o linux-runner-spawn.o
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC \
            -I evaluation -c evaluation/linux_runner_transport.c -o linux-runner-transport.o
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fPIC \
            -I evaluation -c evaluation/native_runner_protocol.c -o native-runner-protocol.o
          cc -shared linux-runner-abi.o linux-runner-spawn.o \
            linux-runner-transport.o native-runner-protocol.o -o libyuki_linux_runner.so
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -I evaluation evaluation/linux_runner_abi.c \
            evaluation/linux_runner_spawn.c evaluation/linux_runner_transport.c \
            evaluation/native_runner_protocol.c tests/linux_runner_abi_test.c \
            -o linux-runner-abi-test
      - name: Run opaque lifecycle-only ABI integration test
        run: ./linux-runner-abi-test "$PWD/linux-runner-helper"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Python protocol reference and golden-vector tests
        run: python -m pytest -q tests/test_native_runner_protocol.py
      - name: Run native runner ctypes boundary tests
        run: python -m unittest discover -s tests -p test_linux_runner_ctypes.py -v

  installed-cli:
    name: Installed CLI Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install Yuki package
        run: python -m pip install .
      - name: Verify first-run configuration and installed command outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from core.config import load_config; assert load_config()['name'] == 'Yuki'"
          yuki doctor

  desktop-qt-smoke:
    name: Desktop Qt offscreen smoke / Ubuntu
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1
      - name: Install core and desktop UI dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-desktop.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Launch the native Qt runtime without a display server
        run: python -m ui.desktop.launch --smoke-test
