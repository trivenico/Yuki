name: Yuki quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run defensive security auditor regression tests
        run: |
          python -m unittest tests.test_defensive_code_audit tests.test_secret_audit -v
      - name: Generate static security triage report
        run: python -m tools.defensive_code_audit . --format json --fail-on critical > defensive-code-audit.json
      - name: Generate redacted secret triage report
        run: python -m tools.secret_audit . --format json > secret-audit.json
      - name: Upload defensive security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuki-defensive-security-reports-${{ matrix.os }}
          path: |
            defensive-code-audit.json
            secret-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
