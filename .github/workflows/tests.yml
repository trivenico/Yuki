name: Yuki quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --requirement requirements-test.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  installed-cli:
    name: Installed CLI Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install Yuki package
        run: python -m pip install .
      - name: Verify first-run configuration and installed command outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from core.config import load_config; assert load_config()['name'] == 'Yuki'"
          yuki doctor

  desktop-qt-smoke:
    name: Desktop Qt offscreen smoke / Ubuntu
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1
      - name: Install core and desktop UI dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-desktop.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Launch the native Qt runtime without a display server
        run: python -m ui.desktop.launch --smoke-test
