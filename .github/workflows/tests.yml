name: Yuki quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  portable-launcher-checks:
    name: Portable launcher checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Unix launcher syntax
        run: sh -n scripts/portable-yuki-unix.sh
      - name: Validate Windows launcher invariants
        run: |
          python -c 'from pathlib import Path; p=Path("scripts/portable-yuki-windows.bat").read_text(); assert "if not defined YUKI_HOME" in p; assert "sys.version_info < (3, 10)" in p; assert chr(34) + "%YUKI_PYTHON%" + chr(34) + " main.py" in p'

  installed-cli:
    name: Installed CLI Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install Yuki package
        run: python -m pip install .
      - name: Verify first-run configuration and installed command outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from core.config import load_config; assert load_config()['name'] == 'Yuki'"
          yuki doctor
