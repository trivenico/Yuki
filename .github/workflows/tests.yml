name: Yuki quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  installed-cli:
    name: Installed CLI Python ${{ matrix.python-version }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install Yuki package
        run: python -m pip install .
      - name: Verify first-run configuration and installed command outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -c "from core.config import load_config; assert load_config()['name'] == 'Yuki'"
          yuki doctor

  yuki-core-runtime:
    name: Yuki-Core CPU runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Yuki training and inference dependencies
        run: python -m pip install -e ".[training]"
      - name: Validate dependency consistency
        run: python -m pip check
      - name: Run Yuki-Core tokenizer and verified-runtime tests
        run: |
          python -m unittest discover -s tests -p "test_yuki_byte_tokenizer.py" -v
          python -m unittest discover -s tests -p "test_yuki_core_runtime.py" -v
          python -m unittest discover -s tests -p "test_yuki_core_provider.py" -v
      - name: Validate training CLI
        run: python scripts/train_yuki_core.py --help
