name: Yuki tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Install CI quality tools
        run: python -m pip install coverage pip-audit
      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt
      - name: Check Python syntax
        run: python scripts/pre_commit_check.py
      - name: Validate golden dataset structure
        run: python tests/golden_dataset.py
      - name: Run unit tests with output-guard coverage
        run: |
          coverage run --source=core.output_guard -m unittest discover -s tests -v
          coverage report --fail-under=85
