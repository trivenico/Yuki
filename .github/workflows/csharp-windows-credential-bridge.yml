name: Yuki C# Windows credential bridge

on:
  pull_request:
    paths:
      - "integrations/dotnet/**"
      - "core/windows_credential_cipher.py"
      - "tests/test_windows_credential_cipher.py"
      - ".github/workflows/csharp-windows-credential-bridge.yml"
  push:
    branches: [main]
    paths:
      - "integrations/dotnet/**"
      - "core/windows_credential_cipher.py"
      - "tests/test_windows_credential_cipher.py"
      - ".github/workflows/csharp-windows-credential-bridge.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run isolated Windows Credential Manager integration tests
        run: dotnet test integrations/dotnet/Yuki.WindowsCredentialBridge.Tests/Yuki.WindowsCredentialBridge.Tests.csproj --configuration Release
      - name: Publish single-file bridge
        run: dotnet publish integrations/dotnet/Yuki.WindowsCredentialBridge/Yuki.WindowsCredentialBridge.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/windows-credential-bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Yuki test dependencies
        run: python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test Python bridge contract
        run: python -m pytest -q tests/test_windows_credential_cipher.py
