name: Dependency manifest audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit duplicate and conflicting requirement declarations
        run: python tools/dependency_audit.py
      - name: Test dependency audit
        run: python -m unittest discover -s tests -p "test_dependency_audit.py" -v
