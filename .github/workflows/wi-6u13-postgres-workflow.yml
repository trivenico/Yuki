name: WI-6U13 PostgreSQL workflow repository

on:
  pull_request:
    paths:
      - "automation/postgres_workflow_store.py"
      - "automation/workflow_repository.py"
      - "automation/workflow_store.py"
      - "automation/task_runtime.py"
      - "migrations/security/0007_workflow_runs.sql"
      - "migrations/security/0008_workload_delegations.sql"
      - "core/postgres_delegation_authority.py"
      - "core/delegation_authority.py"
      - "tests/test_postgres_delegation_authority.py"
      - "tests/test_postgres_workflow_store.py"
      - "tests/test_workflow_repository_contract.py"
      - "tests/test_workflow_store.py"
      - "tests/test_task_runtime.py"
      - ".github/workflows/wi-6u13-postgres-workflow.yml"

jobs:
  postgres-workflow:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yuki
          POSTGRES_PASSWORD: yuki_test_password
          POSTGRES_DB: yuki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuki -d yuki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YUKI_TEST_POSTGRES_URL: postgresql://yuki:yuki_test_password@localhost:5432/yuki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile workflow implementation and tests
        run: python -m py_compile automation/postgres_workflow_store.py automation/workflow_repository.py automation/workflow_store.py automation/task_runtime.py tests/test_postgres_workflow_store.py core/postgres_delegation_authority.py core/delegation_authority.py tests/test_postgres_delegation_authority.py tests/test_workflow_repository_contract.py tests/test_workflow_store.py tests/test_task_runtime.py
      - name: Run PostgreSQL workflow concurrency and fencing tests
        run: |
          python -m unittest discover -s tests -p 'test_postgres_workflow_store.py' -v
          python -m unittest discover -s tests -p 'test_postgres_delegation_authority.py' -v
          python -m unittest discover -s tests -p 'test_delegation_authority.py' -v
      - name: Run SQLite workflow regressions
        run: |
          python -m unittest discover -s tests -p 'test_workflow_store.py' -v
          python -m unittest discover -s tests -p 'test_workflow_repository_contract.py' -v
          python -m unittest discover -s tests -p 'test_task_runtime.py' -v
