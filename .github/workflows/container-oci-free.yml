name: OCI gateway ARM64 container build

on:
  pull_request:
    paths:
      - "cloud/**"
      - "deploy/oci-free/**"
      - ".github/workflows/container-oci-free.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "deploy/oci-free/**"
      - ".github/workflows/container-oci-free.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build OCI A1 ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oci-free/Dockerfile
          platforms: linux/arm64
          push: false
          tags: yuki-gateway:ci-arm64

  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native gateway image
        run: docker build -f deploy/oci-free/Dockerfile -t yuki-gateway:smoke .
      - name: Start gateway container
        run: |
          docker run -d --name yuki-gateway-smoke \
            -p 127.0.0.1:8765:8765 \
            -e YUKI_GATEWAY_ADMIN_TOKEN=ci-smoke-admin-token-with-at-least-32-characters \
            -e YUKI_GATEWAY_OWNER_ID=ci-owner \
            yuki-gateway:smoke
      - name: Wait for gateway health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then exit 0; fi
            sleep 1
          done
          docker logs yuki-gateway-smoke
          exit 1
      - name: Verify task API fails closed without device credentials
        run: |
          status=$(curl --silent --output /tmp/yuki-response --write-out '%{http_code}' http://127.0.0.1:8765/v1/tasks)
          test "$status" = "401"
          grep -q 'unauthorized' /tmp/yuki-response
      - name: Clean up
        if: always()
        run: docker rm -f yuki-gateway-smoke || true
