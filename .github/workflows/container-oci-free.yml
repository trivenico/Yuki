name: OCI gateway ARM64 container build

on:
  pull_request:
    paths:
      - "cloud/**"
      - "deploy/oci-free/**"
      - ".github/workflows/container-oci-free.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "deploy/oci-free/**"
      - ".github/workflows/container-oci-free.yml"

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build OCI A1 ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/oci-free/Dockerfile
          platforms: linux/arm64
          push: false
          tags: yuki-gateway:ci-arm64
