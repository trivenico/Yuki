name: Cloudflare Code Mode adapter
on:
  pull_request:
    paths:
      - "integrations/cloudflare-codemode/**"
      - ".github/workflows/cloudflare-codemode.yml"
  push:
    paths:
      - "integrations/cloudflare-codemode/**"
      - ".github/workflows/cloudflare-codemode.yml"
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/cloudflare-codemode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned package dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check adapter
        run: npm run typecheck
      - name: Run adapter contract tests
        run: npm test
