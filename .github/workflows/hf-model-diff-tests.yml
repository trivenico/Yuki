name: Yuki model snapshot diff tests

on:
  pull_request:
    paths:
      - "yuki_hf_model_diff.py"
      - "tests/test_hf_model_diff.py"
      - "docs/PHASE66_MODEL_CHANGE_DETECTION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run offline model diff tests
        run: python -m unittest discover -s tests -p 'test_hf_model_diff.py'
