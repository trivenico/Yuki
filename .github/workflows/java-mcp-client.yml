name: Yuki Java MCP read-only adapter

on:
  pull_request:
    paths:
      - "integrations/java/mcp-client/**"
      - "docs/JAVA_MCP_INTEGRATION.md"
      - ".github/workflows/java-mcp-client.yml"
  push:
    branches: [main]
    paths:
      - "integrations/java/mcp-client/**"
      - "docs/JAVA_MCP_INTEGRATION.md"
      - ".github/workflows/java-mcp-client.yml"

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Compile and run contract tests
        working-directory: integrations/java/mcp-client
        run: gradle test --no-daemon
