name: Ruff autofix (maintenance branch only)

on:
  push:
    branches: ["phase-lint-autofix"]

permissions:
  contents: write

concurrency:
  group: ruff-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.11.2
      - name: Apply safe Ruff fixes and formatting
        run: |
          ruff check --fix . || true
          ruff format .
      - name: Verify lint, format, and whitespace
        run: |
          ruff check .
          ruff format --check .
          git diff --check
      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff autofixes and formatting"
          git push
