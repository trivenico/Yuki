name: PostgreSQL agent-plan repository contracts

on:
  pull_request:
    paths:
      - "automation/agent_plan_repository.py"
      - "automation/postgres_agent_plan_repository.py"
      - "automation/agent_plan_contract.py"
      - "migrations/security/0007_workflow_runs.sql"
      - "migrations/security/0009_external_operations.sql"
      - "migrations/security/0010_workflow_task_ownership.sql"
      - "migrations/security/0012_agent_plan_repository.sql"
      - "migrations/security/0013_agent_plan_outbox_claim_fencing.sql"
      - "migrations/security/0014_agent_plan_subtask_action.sql"
      - "migrations/security/0015_agent_plan_dispatch_cancellation.sql"
      - "tests/test_agent_plan_repository.py"
      - "tests/test_postgres_agent_plan_repository.py"
      - ".github/workflows/postgres-agent-plan-contracts.yml"

jobs:
  postgres-agent-plan-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yuki
          POSTGRES_PASSWORD: yuki_test_password
          POSTGRES_DB: yuki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuki -d yuki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YUKI_TEST_POSTGRES_URL: postgresql://yuki:yuki_test_password@localhost:5432/yuki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile agent-plan repositories and tests
        run: |
          python -m py_compile automation/agent_plan_repository.py automation/postgres_agent_plan_repository.py automation/agent_plan_contract.py tests/test_agent_plan_repository.py tests/test_postgres_agent_plan_repository.py
      - name: Run SQLite repository contract tests
        run: python -m unittest discover -s tests -p 'test_agent_plan_repository.py' -v
      - name: Run PostgreSQL integration and fencing tests
        run: python -m unittest discover -s tests -p 'test_postgres_agent_plan_repository.py' -v
