name: Yuki provider capability registry tests

on:
  pull_request:
    paths:
      - "providers/capabilities.py"
      - "providers/task_routing.py"
      - "providers/openai_responses.py"
      - "providers/anthropic_messages.py"
      - "providers/factory.py"
      - "providers/catalog.py"
      - "tests/test_openai_responses_*.py"
      - "tests/test_anthropic_*.py"
      - "tests/test_provider_catalog.py"
      - "tests/test_task_routing.py"
      - "tests/test_provider_manager_task_routing.py"
      - "tests/test_provider_factory.py"
      - "yuki_providers.py"
      - "tests/test_provider_capabilities.py"
      - "docs/PHASE68_PROVIDER_CAPABILITY_REGISTRY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run capability registry tests
        run: |
          python -m unittest tests.test_task_routing tests.test_provider_manager_task_routing -v
          python -m unittest discover -s tests -p 'test_provider_capabilities.py' -v
          python -m unittest tests.test_openai_responses_provider tests.test_openai_responses_registry tests.test_anthropic_messages_provider tests.test_anthropic_provider_registry tests.test_provider_factory tests.test_provider_catalog -v
