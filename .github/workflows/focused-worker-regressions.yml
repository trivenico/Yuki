name: Focused worker regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - test/postgres-authorization-audit-writer-role-isolation
    paths:
      - "automation/local_inference_worker.py"
      - "core/inference_jobs.py"
      - "tests/test_local_inference_worker.py"
      - "tests/test_local_worker_runtime.py"
      - ".github/workflows/focused-worker-regressions.yml"

permissions:
  contents: read

jobs:
  worker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Run local inference worker tests with full diagnostics
        run: python -m unittest discover -s tests -p "test_local_inference_worker.py" -v
      - name: Run local worker runtime tests with full diagnostics
        run: python -m unittest discover -s tests -p "test_local_worker_runtime.py" -v
