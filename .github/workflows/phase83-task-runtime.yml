name: Phase 83 unified task runtime

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-task-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  task-runtime:
    name: Task runtime / Python 3.11 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Compile task runtime
        run: python -m compileall -q automation/task_runtime.py automation/workflow_store.py tests/test_task_runtime.py
      - name: Test unified task runtime
        run: python -m unittest discover -s tests -p 'test_task_runtime.py' -v
      - name: Test durable workflow store regressions
        run: python -m unittest discover -s tests -p 'test_workflow_store.py' -v
      - name: Test workflow engine regressions
        run: python -m unittest discover -s tests -p 'test_workflow_engine.py' -v
