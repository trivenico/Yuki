name: Windows desktop package

on:
  pull_request:
    paths:
      - "main.py"
      - "README.md"
      - "docs/**"
      - "ui/**"
      - "core/**"
      - "providers/**"
      - "skills/**"
      - "companion/**"
      - "voice/**"
      - "defense/**"
      - "hackback/**"
      - "knowledge/**"
      - "installer/**"
      - "tests/**"
      - "requirements*.txt"
      - "config.yaml"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build console runtime
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --name YukiRuntime --console --add-data "config.yaml;." --collect-submodules core --collect-submodules providers --collect-submodules skills --collect-submodules companion --collect-submodules voice --collect-submodules defense --collect-submodules hackback --collect-submodules knowledge main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build desktop GUI
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --name YukiDesktop --windowed --add-data "config.yaml;." ui/desktop_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test packaged console runtime
        shell: pwsh
        run: |
          $env:YUKI_HOME = Join-Path $env:RUNNER_TEMP "yuki-package-smoke"
          $runtimeOutput = "/quit" | & .\dist\YukiRuntime\YukiRuntime.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime exited with code $LASTEXITCODE" }
          if (($runtimeOutput -join "\n") -notmatch "guarded core is ready") {
            throw "Packaged runtime did not reach its interactive ready state."
          }

      - name: Assemble portable bundle and installer
        shell: pwsh
        run: |
          Copy-Item config.yaml dist/config.yaml
          Copy-Item README.md dist/README.md
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/INSTALLATION.md dist/docs/INSTALLATION.md
          Compress-Archive -Path dist/YukiDesktop,dist/YukiRuntime,dist/config.yaml,dist/README.md,dist/docs/INSTALLATION.md -DestinationPath dist/Yuki-Windows-x64.zip -Force
          $candidateRoots = @("${env:ProgramFiles(x86)}", "$env:ProgramFiles", "$env:ChocolateyInstall\lib\innosetup")
          $iscc = Get-ChildItem -Path $candidateRoots -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { $iscc = $command.Source }
          }
          if (-not $iscc) { throw "Inno Setup compiler could not be located after installation." }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0" }
          & $iscc "/DAppVersion=$version" installer/yuki.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify release bundle contents
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist/YukiDesktop/YukiDesktop.exe",
            "dist/YukiRuntime/YukiRuntime.exe",
            "dist/Yuki-Setup.exe",
            "dist/Yuki-Windows-x64.zip"
          )
          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release file is missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Required release file is empty: $path"
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path "dist/Yuki-Windows-x64.zip").Path
          )
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace("\\", "/") })
            $requiredEntries = @(
              "YukiDesktop/YukiDesktop.exe",
              "YukiRuntime/YukiRuntime.exe",
              "config.yaml",
              "README.md",
              "docs/INSTALLATION.md"
            )
            foreach ($entry in $requiredEntries) {
              if ($entries -notcontains $entry) {
                throw "Portable bundle is missing required entry: $entry"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuki-windows-x64
          path: |
            dist/Yuki-Windows-x64.zip
            dist/Yuki-Setup.exe
          if-no-files-found: error
          retention-days: 14
 
  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: yuki-windows-x64
          path: dist

      - name: Publish tagged Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" dist/Yuki-Windows-x64.zip dist/Yuki-Setup.exe --generate-notes --title "Yuki $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
