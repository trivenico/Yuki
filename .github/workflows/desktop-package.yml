name: Windows desktop package

on:
  pull_request:
    paths:
      - "main.py"
      - "README.md"
      - "docs/**"
      - "ui/**"
      - "core/**"
      - "providers/**"
      - "skills/**"
      - "companion/**"
      - "voice/**"
      - "defense/**"
      - "hackback/**"
      - "knowledge/**"
      - "installer/**"
      - "tests/**"
      - "requirements*.txt"
      - "config.yaml"
      - ".github/workflows/desktop-package.yml"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build console runtime
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name YukiRuntime --console --add-data "config.yaml;." --collect-submodules core --collect-submodules providers --collect-submodules skills --collect-submodules companion --collect-submodules voice --collect-submodules defense --collect-submodules hackback --collect-submodules knowledge main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build desktop GUI
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onefile --name YukiDesktop --windowed --add-data "config.yaml;." ui/desktop_app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test packaged console runtime
        shell: pwsh
        run: |
          $env:YUKI_HOME = Join-Path $env:RUNNER_TEMP "yuki-package-smoke"
          $runtimeOutput = "/quit" | & .\dist\YukiRuntime.exe
          if ($LASTEXITCODE -ne 0) { throw "Packaged runtime exited with code $LASTEXITCODE" }
          if (($runtimeOutput -join "\n") -notmatch "guarded core is ready") {
            throw "Packaged runtime did not reach its interactive ready state."
          }

      - name: Assemble portable bundle and installer
        shell: pwsh
        run: |
          Copy-Item config.yaml dist/config.yaml
          Copy-Item README.md dist/README.md
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/INSTALLATION.md dist/docs/INSTALLATION.md
          Compress-Archive -Path dist/YukiDesktop.exe,dist/YukiRuntime.exe,dist/config.yaml,dist/README.md,dist/docs/INSTALLATION.md -DestinationPath dist/Yuki-Windows-x64.zip -Force
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not installed." }
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.1.0" }
          & $iscc "/DAppVersion=$version" installer/yuki.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuki-windows-x64
          path: |
            dist/Yuki-Windows-x64.zip
            dist/Yuki-Setup.exe
          if-no-files-found: error
          retention-days: 14
