name: CI

on:
  push:
    branches: [main, "phase-**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and pinned quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,backup]"
      - name: Compile Python sources
        run: python -m compileall -q .
      # Keep independent gates running after a failure so one broken gate does
      # not hide the next actionable failure. The job remains failed if any
      # command below fails.
      - name: Ruff lint
        continue-on-error: true
        id: ruff_lint
        run: ruff check .
      - name: Ruff format check
        continue-on-error: true
        id: ruff_format
        run: ruff format --diff core/task_store.py
      - name: Mypy core, skills, knowledge
        continue-on-error: true
        id: mypy
        run: mypy core skills knowledge
      - name: Console entry point smoke test
        continue-on-error: true
        id: entrypoint
        run: python -c "from importlib.metadata import entry_points; eps = [ep for ep in entry_points(group='console_scripts') if ep.name == 'yuki']; assert any(ep.value == 'main:main' for ep in eps), eps"
      - name: Run pytest with coverage report
        continue-on-error: true
        id: unit_tests
        run: python -m pytest tests -v --cov=core --cov=skills --cov=knowledge --cov=providers --cov-report=term-missing --cov-report=xml
      - name: Enforce coverage threshold
        if: always() && steps.unit_tests.outcome == 'success'
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("coverage.xml")
          if not report.is_file():
              raise SystemExit("coverage.xml was not generated")
          root = ET.parse(report).getroot()
          rate = float(root.attrib.get("line-rate", "0"))
          print(f"Line coverage: {rate:.1%} (required: 80.0%)")
          if rate < 0.80:
              raise SystemExit("Coverage is below the 80% acceptance threshold")
          PY
      - name: Enforce quality gates
        if: always()
        env:
          RUFF_LINT_OUTCOME: ${{ steps.ruff_lint.outcome }}
          RUFF_FORMAT_OUTCOME: ${{ steps.ruff_format.outcome }}
          MYPY_OUTCOME: ${{ steps.mypy.outcome }}
          ENTRYPOINT_OUTCOME: ${{ steps.entrypoint.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          failed=0
          for gate in RUFF_LINT RUFF_FORMAT MYPY ENTRYPOINT UNIT_TESTS; do
            outcome_var="${gate}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != "success" ]; then
              echo "::error::$gate gate failed: $outcome"
              failed=1
            fi
          done
          exit "$failed"
