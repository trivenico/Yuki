name: Yuki CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuki-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip
      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-integration:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Pull sandbox test image
        run: docker pull python:3.12-slim
      - name: Resolve immutable image digest
        id: sandbox-image
        shell: bash
        run: |
          IMAGE_REF="$(docker image inspect --format='{{index .RepoDigests 0}}' python:3.12-slim)"
          if [[ ! "$IMAGE_REF" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve python image to a digest: $IMAGE_REF" >&2
            exit 1
          fi
          echo "image=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Exercise real Docker sandbox
        env:
          YUKI_DOCKER_INTEGRATION_IMAGE: ${{ steps.sandbox-image.outputs.image }}
        run: python -m unittest tests.test_docker_sandbox_integration -v
