name: Phase 88 authorized read-only tools
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yuki-authorized-read-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Authorized read tools / Python 3.11 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile tool adapter and tests
        run: python -m compileall -q automation/authorized_read_tools.py tests/test_authorized_read_tools.py
      - name: Test authorized read-only workspace tools
        run: python -m unittest discover -s tests -p 'test_authorized_read_tools.py' -v
