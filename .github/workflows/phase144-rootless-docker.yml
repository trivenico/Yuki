name: Phase 144 rootless Docker isolation

on:
  workflow_dispatch:
    inputs:
      worker_image:
        description: "Approved Python 3.11 worker image pinned by @sha256:<64 lowercase hex chars>"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: phase144-rootless-docker
  cancel-in-progress: false

jobs:
  rootless-docker-integration:
    # Dedicated trusted runner only: do not execute untrusted PR code on this host.
    runs-on: [self-hosted, linux, yuki-rootless-docker]
    timeout-minutes: 15
    steps:
      - name: Check out selected ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate immutable worker image input
        env:
          WORKER_IMAGE: ${{ inputs.worker_image || vars.YUKI_TEST_WORKER_IMAGE }}
        run: |
          python - <<'PY'
          import os
          import re
          image = os.environ["WORKER_IMAGE"].strip()
          if not re.fullmatch(r"docker\\.io/library/python:3\\.11-slim@sha256:[0-9a-f]{64}", image):
              raise SystemExit("worker_image must be the approved official Python 3.11 slim image pinned by lowercase SHA-256 digest")
          PY

      - name: Verify rootless Docker daemon
        run: |
          docker info --format '{{json .SecurityOptions}}' > docker-security-options.json
          python - <<'PY'
          import json
          with open("docker-security-options.json", encoding="utf-8") as stream:
              options = json.load(stream)
          if not isinstance(options, list) or not any(
              isinstance(option, str) and "rootless" in option.casefold()
              for option in options
          ):
              raise SystemExit("Docker daemon is not rootless; refusing integration test")
          PY

      - name: Pull only the approved digest-pinned worker image
        env:
          WORKER_IMAGE: ${{ inputs.worker_image || vars.YUKI_TEST_WORKER_IMAGE }}
        run: docker pull "$WORKER_IMAGE"

      - name: Run opt-in Docker integration contract
        env:
          YUKI_DOCKER_INTEGRATION: "1"
          YUKI_TEST_WORKER_IMAGE: ${{ inputs.worker_image || vars.YUKI_TEST_WORKER_IMAGE }}
        run: python -m unittest tests.integration.test_isolated_upgrade_worker_docker -v
