name: WI-6U PostgreSQL security repositories

on:
  pull_request:
    paths:
      - "core/postgres_authorization_audit.py"
      - "core/authorization_audit.py"
      - "core/authorization_audit_factory.py"
      - "core/production_security.py"
      - "core/production_security_runtime.py"
      - "api/runtime.py"
      - "scripts/run_web.py"
      - "tests/test_api_runtime.py"
      - "tests/test_run_web.py"
      - "docs/PRODUCTION_SECURITY_BOOTSTRAP.md"
      - "core/local_cli_security.py"
      - "main.py"
      - "tests/test_local_cli_security.py"
      - "core/postgres_security_lease_store.py"
      - "core/postgres_security_event_ingestion.py"
      - "core/postgres_security_alert_outbox.py"
      - "core/postgres_security_alert_operator_reader.py"
      - "tests/test_postgres_alert_operator_reader_role_isolation.py"
      - "core/postgres_workload_key_registry.py"
      - "core/postgres_authorization_audit.py"
      - "core/authorization_audit.py"
      - "core/authorization_audit_factory.py"
      - "core/production_security.py"
      - "core/postgres_security_event_monitor.py"
      - "automation/postgres_workflow_store.py"
      - "automation/workflow_repository.py"
      - "automation/workflow_store.py"
      - "automation/task_runtime.py"
      - "tests/test_postgres_workflow_store.py"
      - "core/security_event_monitor.py"
      - "core/security_event_monitor_factory.py"
      - "core/workload_key_registry.py"
      - "core/workload_key_registry_factory.py"
      - "core/workload_key_admin.py"
      - "core/security_event_ingestion.py"
      - "migrations/security/**"
      - "tests/test_postgres_authorization_audit.py"
      - "tests/test_postgres_audit_reader_role_isolation.py"
      - "tests/test_postgres_security_ingestion_role_isolation.py"
      - "tests/test_postgres_security_work_lease_role_isolation.py"
      - "tests/test_postgres_security_alert_outbox_role_isolation.py"
      - "tests/test_authorization_audit.py"
      - "tests/test_authorization_audit_factory.py"
      - "tests/test_production_security.py"
      - "tests/test_production_security_runtime.py"
      - "tests/test_postgres_production_security_runtime.py"
      - "tests/test_postgres_security_lease_store.py"
      - "tests/test_postgres_security_alert_outbox.py"
      - "tests/test_postgres_workload_key_registry.py"
      - "tests/test_postgres_authorization_audit.py"
      - "tests/test_authorization_audit.py"
      - "tests/test_authorization_audit_factory.py"
      - "tests/test_production_security.py"
      - "tests/test_production_security_readiness.py"
      - "tests/test_postgres_security_event_monitor.py"
      - "tests/test_security_event_monitor_factory.py"
      - "tests/test_workload_key_registry_factory.py"
      - "tests/test_workload_key_admin.py"
      - "tests/test_security_event_ingestion.py"
      - ".github/workflows/wi-6u1-postgres-security-leases.yml"
  push:
    branches: [main]
    paths:
      - "core/postgres_security_event_monitor.py"
      - "core/security_event_monitor.py"
      - "core/security_event_monitor_factory.py"
      - "tests/test_postgres_security_event_monitor.py"
      - "tests/test_security_event_monitor_factory.py"
      - "core/postgres_security_lease_store.py"
      - "core/postgres_security_event_ingestion.py"
      - "core/postgres_security_alert_outbox.py"
      - "core/postgres_workload_key_registry.py"
      - "core/security_event_ingestion.py"
      - "migrations/security/**"
      - "tests/test_postgres_security_lease_store.py"
      - "tests/test_postgres_security_alert_outbox.py"
      - "tests/test_postgres_workload_key_registry.py"
      - "tests/test_security_event_ingestion.py"
      - ".github/workflows/wi-6u1-postgres-security-leases.yml"

jobs:
  postgres-security-leases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yuki
          POSTGRES_PASSWORD: yuki_test_password
          POSTGRES_DB: yuki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yuki -d yuki_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      YUKI_TEST_POSTGRES_URL: postgresql://yuki:yuki_test_password@localhost:5432/yuki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile lease implementation and tests
        run: python -m py_compile main.py api/runtime.py scripts/run_web.py core/local_cli_security.py core/postgres_authorization_audit.py core/authorization_audit.py core/authorization_audit_factory.py core/production_security.py core/production_security_runtime.py core/security_event_monitor.py core/postgres_security_lease_store.py core/postgres_security_event_ingestion.py core/postgres_security_alert_outbox.py core/postgres_security_alert_operator_reader.py core/postgres_workload_key_registry.py core/postgres_security_event_monitor.py automation/postgres_workflow_store.py automation/workflow_repository.py automation/workflow_store.py automation/task_runtime.py tests/test_postgres_workflow_store.py core/security_event_monitor.py core/security_event_monitor_factory.py core/workload_key_registry.py core/workload_key_registry_factory.py core/security_event_ingestion.py tests/test_postgres_authorization_audit.py tests/test_postgres_audit_reader_role_isolation.py tests/test_postgres_security_ingestion_role_isolation.py tests/test_postgres_security_work_lease_role_isolation.py tests/test_postgres_security_alert_outbox_role_isolation.py tests/test_postgres_alert_operator_reader_role_isolation.py tests/test_authorization_audit.py tests/test_authorization_audit_factory.py tests/test_production_security.py tests/test_production_security_runtime.py tests/test_local_cli_security.py tests/test_api_runtime.py tests/test_run_web.py tests/test_postgres_production_security_runtime.py tests/test_production_security_readiness.py tests/test_postgres_security_lease_store.py tests/test_postgres_security_alert_outbox.py tests/test_postgres_workload_key_registry.py tests/test_postgres_security_event_monitor.py tests/test_security_event_monitor_factory.py tests/test_workload_key_registry_factory.py tests/test_workload_key_admin.py tests/test_security_event_ingestion.py
      - name: Run real PostgreSQL concurrency and fencing tests
        run: |
          python -m unittest discover -s tests -p 'test_postgres_authorization_audit.py' -v
          python -m unittest discover -s tests -p 'test_postgres_audit_reader_role_isolation.py' -v
          python -m unittest discover -s tests -p 'test_postgres_security_ingestion_role_isolation.py' -v
          python -m unittest discover -s tests -p 'test_postgres_security_work_lease_role_isolation.py' -v
          python -m unittest discover -s tests -p 'test_postgres_security_alert_outbox_role_isolation.py' -v
          python -m unittest discover -s tests -p 'test_postgres_alert_operator_reader_role_isolation.py' -v
          python -m unittest discover -s tests -p 'test_authorization_audit.py' -v
          python -m unittest discover -s tests -p 'test_authorization_audit_factory.py' -v
          python -m unittest discover -s tests -p 'test_production_security.py' -v
          python -m unittest discover -s tests -p 'test_production_security_runtime.py' -v
          python -m unittest discover -s tests -p 'test_local_cli_security.py' -v
          python -m unittest discover -s tests -p 'test_api_runtime.py' -v
          python -m unittest discover -s tests -p 'test_run_web.py' -v
          python -m unittest discover -s tests -p 'test_postgres_production_security_runtime.py' -v
          python -m unittest discover -s tests -p 'test_production_security_readiness.py' -v
          python -m unittest discover -s tests -p 'test_postgres_security_lease_store.py' -v
          python -m unittest discover -s tests -p 'test_postgres_security_alert_outbox.py' -v
          python -m unittest discover -s tests -p 'test_postgres_workload_key_registry.py' -v
          python -m unittest discover -s tests -p 'test_postgres_security_event_monitor.py' -v
          python -m unittest discover -s tests -p 'test_security_event_monitor_factory.py' -v
          python -m unittest discover -s tests -p 'test_workload_key_registry_factory.py' -v
          python -m unittest discover -s tests -p 'test_workload_key_admin.py' -v
          python -m unittest discover -s tests -p 'test_security_event_ingestion.py' -v
          python -m unittest discover -s tests -p 'test_postgres_workflow_store.py' -v
