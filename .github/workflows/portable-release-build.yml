name: Portable release candidate orchestration

on:
  push:
    paths:
      - "scripts/portable_release_build.py"
      - "scripts/portable_runtime_assembler.py"
      - "scripts/portable_bundle.py"
      - "scripts/portable_manifest.py"
      - "scripts/portable_native_audit.py"
      - "scripts/portable_runtime_inputs.py"
      - "tests/test_portable_release_build.py"
      - ".github/workflows/portable-release-build.yml"
  pull_request:
    paths:
      - "scripts/portable_release_build.py"
      - "scripts/portable_runtime_assembler.py"
      - "scripts/portable_bundle.py"
      - "scripts/portable_manifest.py"
      - "scripts/portable_native_audit.py"
      - "scripts/portable_runtime_inputs.py"
      - "tests/test_portable_release_build.py"
      - ".github/workflows/portable-release-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestration-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run release orchestration tests
        run: python -m unittest discover -s tests -p "test_portable_release_build.py" -v
      - name: Compile release orchestration modules
        run: python -m py_compile scripts/portable_release_build.py scripts/portable_runtime_assembler.py scripts/portable_bundle.py scripts/portable_manifest.py scripts/portable_native_audit.py scripts/portable_runtime_inputs.py
