name: Desktop wake-word UI integration tests

on:
  pull_request:
    paths:
      - "ui/desktop/launch.py"
      - "voice/**"
      - "tests/test_wakeword_*.py"
      - "tests/test_voice_session.py"
      - "tests/test_desktop_voice_output.py"
      - "requirements-wakeword-openwakeword.txt"
      - ".github/workflows/desktop-wakeword-ui-tests.yml"
  push:
    branches: [main, feat/desktop-wakeword-controls]
    paths:
      - "ui/desktop/launch.py"
      - "voice/**"
      - "tests/test_wakeword_*.py"
      - "tests/test_voice_session.py"
      - "tests/test_desktop_voice_output.py"
      - "requirements-wakeword-openwakeword.txt"
      - ".github/workflows/desktop-wakeword-ui-tests.yml"

permissions:
  contents: read

concurrency:
  group: desktop-wakeword-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-wakeword:
    name: Desktop wake-word integration (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-wakeword-openwakeword.txt
      - name: Install optional wake-word runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-wakeword-openwakeword.txt
          python -m pip install pytest
      - name: Compile desktop and voice modules
        run: python -m compileall -q ui/desktop voice
      - name: Run wake-word and voice regression tests
        run: |
          python -m pytest -q \
            tests/test_wakeword_session.py \
            tests/test_wakeword_audio.py \
            tests/test_openwakeword_detector.py \
            tests/test_voice_session.py \
            tests/test_desktop_voice_output.py
