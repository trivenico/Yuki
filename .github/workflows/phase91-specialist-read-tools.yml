name: Phase 91 specialist read-tool integration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: yuki-specialist-read-tools-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Specialist read tools / Python 3.11 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile specialist tool adapter and tests
        run: python -m compileall -q automation/specialist_read_tool_adapter.py automation/authorized_read_tools.py automation/specialist_worker.py tests/test_specialist_read_tool_adapter.py
      - name: Test specialist read-tool adapter
        run: python -m unittest discover -s tests -p 'test_specialist_read_tool_adapter.py' -v
      - name: Test authorized workspace tools
        run: python -m unittest discover -s tests -p 'test_authorized_read_tools.py' -v
      - name: Test specialist worker
        run: python -m unittest discover -s tests -p 'test_specialist_worker.py' -v
      - name: Test task runtime
        run: python -m unittest discover -s tests -p 'test_task_runtime.py' -v
      - name: Test workflow safety
        run: python -m unittest discover -s tests -p 'test_workflow_engine.py' -v
