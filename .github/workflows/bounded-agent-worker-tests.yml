name: Yuki bounded agent worker tests

on:
  pull_request:
    paths:
      - "yuki_agent_runtime.py"
      - "yuki_agent_worker.py"
      - "tests/test_yuki_agent_worker.py"
      - "tests/test_yuki_agent_runtime.py"
      - "docs/PHASE70_BOUNDED_AGENT_WORKER.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run worker tests
        run: python -m unittest discover -s tests -p 'test_yuki_agent_worker.py'
